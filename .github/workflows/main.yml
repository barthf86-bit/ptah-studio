name: Ptah Studio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de ejecución'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_audit:
        description: '¿Ejecutar auditoría PWA de Lighthouse?'
        required: true
        default: true
        type: boolean
      custom_tag:
        description: 'Etiqueta o versión personalizada'
        required: false
        default: 'v1.0.0'
        type: string

jobs:
  build-and-audit:
    name: Build, Audit & Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Environment Variables for Validation & Build
        run: |
          cat << EOF_ENV > .env
          APP_ID="com.ptahstudio.demo"
          EXTENSION_ID="${{ secrets.EXTENSION_ID || 'abcdefghijklmnopqrstuvwxyzabcdef' }}"
          CWS_CLIENT_ID="${{ secrets.CWS_CLIENT_ID || '123456789012-sample.apps.googleusercontent.com' }}"
          CWS_CLIENT_SECRET="${{ secrets.CWS_CLIENT_SECRET || 'GOCSPX-samplesecret123' }}"
          CWS_REFRESH_TOKEN="${{ secrets.CWS_REFRESH_TOKEN || '1//sample_refresh_token_123' }}"
          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY || 'AIzaSySampleKey123456789' }}"
          ANDROID_STORE_PASSWORD="${{ secrets.ANDROID_STORE_PASSWORD || 'SuperSecretPassword123' }}"
          EOF_ENV

      - name: Validate Environment Variables
        run: npm run validate:env

      - name: Build Extension / PWA Package
        run: npm run build

      - name: Run PWA Lighthouse Audit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_audit == true }}
        run: npm run audit:pwa

      - name: Upload Lighthouse Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
          retention-days: 14

      # =========================================================
      # 🟢 NOTIFICACIONES DE ÉXITO (if: success())
      # =========================================================
      - name: Send Telegram Success Notification
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            ENV_VAL="${{ inputs.environment || 'Push/PR (Auto)' }}"
            TAG_VAL="${{ inputs.custom_tag || 'N/A' }}"

            MESSAGE="✅ *Pipeline CI/CD Exitoso - Ptah Studio*%0A%0A"
            MESSAGE+="*Repositorio:* ${{ github.repository }}%0A"
            MESSAGE+="*Rama / Evento:* ${{ github.ref_name }} (${{ github.event_name }})%0A"
            MESSAGE+="*Entorno:* ${ENV_VAL}%0A"
            MESSAGE+="*Versión / Tag:* ${TAG_VAL}%0A"
            MESSAGE+="*Ejecutado por:* ${{ github.actor }}%0A"
            MESSAGE+="*Commit:* \`${{ github.sha }}\`%0A%0A"
            MESSAGE+="[Ver Detalle de Ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown"
          else
            echo "⚠️ Secretos de Telegram no configurados. Omitiendo notificación."
          fi

      - name: Send Slack Success Notification
        if: success()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            ENV_VAL="${{ inputs.environment || 'Push/PR (Auto)' }}"
            TAG_VAL="${{ inputs.custom_tag || 'N/A' }}"

            cat << EOF_SLACK > /tmp/slack_success.json
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Compilación y Auditoría PWA Exitosas",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repositorio:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Rama / Evento:*\n${{ github.ref_name }} (${{ github.event_name }})" },
                    { "type": "mrkdwn", "text": "*Entorno:*\n${ENV_VAL}" },
                    { "type": "mrkdwn", "text": "*Versión / Tag:*\n${TAG_VAL}" },
                    { "type": "mrkdwn", "text": "*Ejecutado por:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Ver Detalle en GitHub Actions" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
EOF_SLACK

            curl -s -X POST -H 'Content-type: application/json' \
              --data @/tmp/slack_success.json \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          else
            echo "⚠️ Webhook de Slack no configurado. Omitiendo notificación."
          fi

      # =========================================================
      # 🔴 NOTIFICACIONES DE FALLO (if: failure())
      # =========================================================
      - name: Send Telegram Failure Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            ENV_VAL="${{ inputs.environment || 'Push/PR (Auto)' }}"
            TAG_VAL="${{ inputs.custom_tag || 'N/A' }}"
            AUDIT_VAL="${{ inputs.run_audit != '' && inputs.run_audit || 'true' }}"

            MESSAGE="🚨 *Fallo de Pipeline CI/CD - Ptah Studio*%0A%0A"
            MESSAGE+="*Repositorio:* ${{ github.repository }}%0A"
            MESSAGE+="*Rama / Evento:* ${{ github.ref_name }} (${{ github.event_name }})%0A"
            MESSAGE+="*Entorno:* ${ENV_VAL}%0A"
            MESSAGE+="*Versión / Tag:* ${TAG_VAL}%0A"
            MESSAGE+="*Auditoría PWA requerida:* ${AUDIT_VAL}%0A"
            MESSAGE+="*Ejecutado por:* ${{ github.actor }}%0A"
            MESSAGE+="*Commit:* \`${{ github.sha }}\`%0A%0A"
            MESSAGE+="[Ver Log de Ejecución en GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown"
          else
            echo "⚠️ Secretos de Telegram no configurados. Omitiendo notificación."
          fi

      - name: Send Slack Failure Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            ENV_VAL="${{ inputs.environment || 'Push/PR (Auto)' }}"
            TAG_VAL="${{ inputs.custom_tag || 'N/A' }}"
            AUDIT_VAL="${{ inputs.run_audit != '' && inputs.run_audit || 'true' }}"

            cat << EOF_SLACK > /tmp/slack_failure.json
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Fallo de Compilación / Auditoría PWA",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repositorio:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Rama / Evento:*\n${{ github.ref_name }} (${{ github.event_name }})" },
                    { "type": "mrkdwn", "text": "*Entorno:*\n${ENV_VAL}" },
                    { "type": "mrkdwn", "text": "*Versión / Tag:*\n${TAG_VAL}" },
                    { "type": "mrkdwn", "text": "*Auditoría PWA:*\n${AUDIT_VAL}" },
                    { "type": "mrkdwn", "text": "*Ejecutado por:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Ver Log en GitHub Actions" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }
EOF_SLACK

            curl -s -X POST -H 'Content-type: application/json' \
              --data @/tmp/slack_failure.json \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          else
            echo "⚠️ Webhook de Slack no configurado. Omitiendo notificación."
          fi
